<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14161a">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Ledger — Life &amp; Performance OS</title>
<style>
/* ============================================================
   DESIGN TOKENS
   Ledger: an academic + athletic performance system.
   Base: cool charcoal (field-notebook-at-night), not pure black.
   Accents map to domains — track orange (physical), ink blue
   (academic), signal green (language) — so color itself carries
   meaning across the app rather than decorating it.
   Type: Fraunces (serif, personality, used for numbers & headers)
         + IBM Plex Sans (technical, for body/data/labels).
   ============================================================ */
@font-face {
  font-family: 'Fraunces';
  src: local('Fraunces');
}
:root {
  --bg: #14161a;
  --bg-raised: #1b1e23;
  --bg-inset: #0f1114;
  --line: #2a2d33;
  --line-soft: #22252b;
  --text: #e9e7e0;
  --text-dim: #9a9fa6;
  --text-faint: #5e636b;

  --track: #ff5d2e;      /* physical / training */
  --track-dim: #7a3a26;
  --ink: #6d8bff;         /* academic */
  --ink-dim: #37406e;
  --signal: #35c98d;      /* languages */
  --signal-dim: #23593f;
  --amber: #e6b34d;       /* projects / professional */
  --amber-dim: #6b551f;
  --violet: #b58cf0;      /* recovery / discipline */
  --violet-dim: #4c3c6b;

  --danger: #ef5b5b;
  --good: #35c98d;

  --radius-s: 3px;
  --radius-m: 6px;

  --serif: 'Fraunces', 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
  --sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
button {
  font-family: inherit;
  cursor: pointer;
}
input, select, textarea {
  font-family: inherit;
  font-size: inherit;
  color: var(--text);
  background: var(--bg-inset);
  border: 1px solid var(--line);
  border-radius: var(--radius-s);
  padding: 8px 10px;
}
input:focus, select:focus, textarea:focus, button:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 1px;
}
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; }
::-webkit-scrollbar-track { background: transparent; }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

/* ---------- layout shell ---------- */
#app {
  display: grid;
  grid-template-columns: 232px 1fr;
  min-height: 100vh;
}
@media (max-width: 860px) {
  #app { grid-template-columns: 1fr; }
  #sidebar { display: none; }
  #sidebar.open { display: flex; position: fixed; inset: 0; z-index: 50; width: 100%; }
}

#sidebar {
  background: var(--bg-raised);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  padding: 20px 0;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}
.brand {
  font-family: var(--serif);
  font-size: 20px;
  font-weight: 600;
  padding: 0 20px 18px;
  border-bottom: 1px solid var(--line-soft);
  margin-bottom: 8px;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
}
.brand .close-btn { display: none; background: none; border: none; color: var(--text-dim); font-size: 20px; }
@media (max-width: 860px) { .brand .close-btn { display: block; } }

.nav-group { margin-top: 14px; }
.nav-label {
  padding: 0 20px 6px;
  font-size: 11px;
  letter-spacing: 0.04em;
  color: var(--text-faint);
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 20px;
  color: var(--text-dim);
  text-decoration: none;
  border-left: 2px solid transparent;
  font-size: 14px;
  background: none;
  border-top: none; border-right: none; border-bottom: none;
  width: 100%;
  text-align: left;
}
.nav-item:hover { color: var(--text); background: var(--bg-inset); }
.nav-item.active {
  color: var(--text);
  border-left-color: var(--ink);
  background: var(--bg-inset);
}
.nav-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

.sidebar-foot {
  margin-top: auto;
  padding: 14px 20px 0;
  border-top: 1px solid var(--line-soft);
  font-size: 12px;
  color: var(--text-faint);
}

#main {
  padding: 26px 32px 80px;
  max-width: 1120px;
  width: 100%;
}
@media (max-width: 860px) {
  #main { padding: 18px 16px 90px; }
}

.topbar {
  display: none;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}
@media (max-width: 860px) {
  .topbar { display: flex; }
}
.hamburger {
  background: var(--bg-raised);
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: var(--radius-s);
  padding: 8px 12px;
}

.page { display: none; }
.page.active { display: block; }

.page-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-bottom: 22px;
  flex-wrap: wrap;
  gap: 10px;
}
.page-title {
  font-family: var(--serif);
  font-size: 28px;
  font-weight: 600;
  margin: 0;
}
.page-sub { color: var(--text-dim); font-size: 13px; margin-top: 4px; }

/* ---------- primitives ---------- */
.section {
  margin-bottom: 30px;
}
.section-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  border-bottom: 1px solid var(--line);
  padding-bottom: 8px;
  margin-bottom: 14px;
}
.section-title {
  font-size: 13px;
  color: var(--text-dim);
  font-weight: 500;
}
.section-title .n { color: var(--text-faint); font-weight: 400; }

.card {
  background: var(--bg-raised);
  border: 1px solid var(--line);
  border-radius: var(--radius-m);
  padding: 16px;
}
.grid {
  display: grid;
  gap: 14px;
}
.grid-2 { grid-template-columns: 1fr 1fr; }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
@media (max-width: 760px) {
  .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
}

.stat {
  border-left: 2px solid var(--line);
  padding: 2px 0 2px 12px;
}
.stat.track { border-color: var(--track); }
.stat.ink { border-color: var(--ink); }
.stat.signal { border-color: var(--signal); }
.stat.amber { border-color: var(--amber); }
.stat.violet { border-color: var(--violet); }
.stat-num { font-family: var(--serif); font-size: 26px; line-height: 1.1; }
.stat-label { font-size: 12px; color: var(--text-dim); margin-top: 2px; }

.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  padding: 3px 9px;
  border-radius: 999px;
  border: 1px solid var(--line);
  color: var(--text-dim);
}
.pill.track { border-color: var(--track-dim); color: var(--track); }
.pill.ink { border-color: var(--ink-dim); color: var(--ink); }
.pill.signal { border-color: var(--signal-dim); color: var(--signal); }
.pill.amber { border-color: var(--amber-dim); color: var(--amber); }
.pill.violet { border-color: var(--violet-dim); color: var(--violet); }
.pill.danger { border-color: #6b2b2b; color: var(--danger); }

.btn {
  background: var(--bg-inset);
  border: 1px solid var(--line);
  color: var(--text);
  padding: 8px 14px;
  border-radius: var(--radius-s);
  font-size: 13px;
}
.btn:hover { border-color: var(--text-faint); }
.btn.primary { background: var(--ink); border-color: var(--ink); color: #0b0e1a; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { border-color: var(--danger); color: var(--danger); background: transparent; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-dim); }
.btn.small { padding: 5px 10px; font-size: 12px; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

.row { display: flex; gap: 10px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.between { justify-content: space-between; }
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
.field label { font-size: 12px; color: var(--text-dim); }
.field input, .field select, .field textarea { width: 100%; }

.list-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid var(--line-soft);
  gap: 10px;
}
.list-item:last-child { border-bottom: none; }

.empty {
  color: var(--text-faint);
  font-size: 13px;
  padding: 18px 0;
  text-align: center;
  border: 1px dashed var(--line);
  border-radius: var(--radius-m);
}

.bar-track {
  height: 6px;
  background: var(--bg-inset);
  border-radius: 4px;
  overflow: hidden;
}
.bar-fill { height: 100%; border-radius: 4px; }

.modal-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(10,11,13,0.72);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--bg-raised);
  border: 1px solid var(--line);
  border-radius: var(--radius-m);
  padding: 22px;
  width: 100%;
  max-width: 460px;
  max-height: 86vh;
  overflow-y: auto;
}
.modal h3 { font-family: var(--serif); margin: 0 0 14px; font-size: 19px; }

.toast-wrap {
  position: fixed; bottom: 20px; right: 20px; z-index: 200;
  display: flex; flex-direction: column; gap: 8px;
}
.toast {
  background: var(--bg-raised);
  border: 1px solid var(--line);
  border-left: 3px solid var(--good);
  padding: 10px 14px;
  border-radius: var(--radius-s);
  font-size: 13px;
  max-width: 300px;
}
.toast.err { border-left-color: var(--danger); }

hr.hair { border: none; border-top: 1px solid var(--line-soft); margin: 14px 0; }

.mono { font-family: var(--mono); font-size: 12px; color: var(--text-dim); }
.muted { color: var(--text-dim); }
.faint { color: var(--text-faint); }
textarea { resize: vertical; min-height: 70px; }

/* ---- PHONE APP LAYER ---- */
#tabbar{display:none}
@media (max-width:860px){
  body{padding-top:env(safe-area-inset-top);-webkit-tap-highlight-color:transparent}
  #pages{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
  #tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:rgba(27,30,35,.9);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  #tabbar button{background:none;border:0;color:var(--text-faint);font-family:inherit;font-size:10.5px;font-weight:600;line-height:1;letter-spacing:.3px;
    padding:6px 0 4px;min-height:50px;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;transition:color .15s}
  #tabbar svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  #tabbar button.active{color:var(--text)}
  #tabbar button.active::before{content:"";position:absolute;top:-7px;width:26px;height:3px;border-radius:0 0 3px 3px;background:var(--track)}
  .btn{min-height:42px;white-space:nowrap}
  input,select,textarea{font-size:16px!important}
  .card{border-radius:10px}
  .topbar .hamburger{display:none}
  #sidebar{display:none}
  #sidebar.open{display:flex;position:fixed;inset:0;z-index:60;width:100%;padding-top:calc(20px + env(safe-area-inset-top))}
}
.rem-row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.rem-row:last-child{border-bottom:0}
.rem-row input[type=time]{width:auto;min-width:96px}
.rem-row input[type=checkbox]{width:22px;height:22px;accent-color:var(--track)}
</style>

<body>

  <main id="main">
    <div class="topbar">
      <button class="hamburger" onclick="openSidebar()">☰ Menu</button>

</div>
<nav id="tabbar"><button data-tab-go="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 3 3 5-6"/></svg>Today</button><button data-tab-go="week"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Week</button><button data-tab-go="training"><svg viewBox="0 0 24 24"><path d="M13 3 5 14h6l-1 7 8-11h-6z"/></svg>Training</button><button data-tab-go="academic"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/></svg>Study</button><button data-tab-more><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>More</button></nav>

<script>
/* ============================================================
   LEDGER — core: constants, db layer, utilities
   ============================================================ */
const DB_NAME = 'ledger_os';
const DB_VERSION = 1;
let db = null;

const STORES = [
  { name: 'habits', keyPath: 'id' },
  { name: 'habitLogs', keyPath: 'id' },
  { name: 'runs', keyPath: 'id' },
  { name: 'strengthSessions', keyPath: 'id' },
  { name: 'courses', keyPath: 'id' },
  { name: 'assignments', keyPath: 'id' },
  { name: 'studySessions', keyPath: 'id' },
  { name: 'languageLogs', keyPath: 'id' },
  { name: 'projects', keyPath: 'id' },
  { name: 'skills', keyPath: 'id' },
  { name: 'goals', keyPath: 'id' },
  { name: 'dailyReflections', keyPath: 'id' },
  { name: 'weeklyReviews', keyPath: 'id' },
  { name: 'recoveryLogs', keyPath: 'id' },
  { name: 'meta', keyPath: 'key' }
];

function openDatabase() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const _db = e.target.result;
      STORES.forEach(s => {
        if (!_db.objectStoreNames.contains(s.name)) {
          _db.createObjectStore(s.name, { keyPath: s.keyPath });
        }
      });
    };
    req.onsuccess = (e) => { db = e.target.result; resolve(db); };
    req.onerror = (e) => reject(e.target.error);
  });
}

function tx(storeName, mode = 'readonly') {
  return db.transaction(storeName, mode).objectStore(storeName);
}
function dbGetAll(storeName) {
  return new Promise((resolve, reject) => {
    const req = tx(storeName).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}
function dbGet(storeName, key) {
  return new Promise((resolve, reject) => {
    const req = tx(storeName).get(key);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}
function dbPut(storeName, value) {
  return new Promise((resolve, reject) => {
    const req = tx(storeName, 'readwrite').put(value);
    req.onsuccess = () => resolve(value);
    req.onerror = () => reject(req.error);
  });
}
function dbDelete(storeName, key) {
  return new Promise((resolve, reject) => {
    const req = tx(storeName, 'readwrite').delete(key);
    req.onsuccess = () => resolve(true);
    req.onerror = () => reject(req.error);
  });
}
function dbClear(storeName) {
  return new Promise((resolve, reject) => {
    const req = tx(storeName, 'readwrite').clear();
    req.onsuccess = () => resolve(true);
    req.onerror = () => reject(req.error);
  });
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
function todayISO(offsetDays = 0) {
  const d = new Date();
  d.setDate(d.getDate() + offsetDays);
  return d.toISOString().slice(0, 10);
}
function nowISO() { return new Date().toISOString(); }
function dayName(iso) {
  const names = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  return names[new Date(iso + 'T12:00:00').getDay()];
}
function shortDate(iso) {
  const d = new Date(iso + 'T12:00:00');
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}
function fmtDateTime(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' · ' +
    d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
}
function daysBetween(a, b) {
  const A = new Date(a + 'T00:00:00'), B = new Date(b + 'T00:00:00');
  return Math.round((B - A) / 86400000);
}
function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }
function round1(n) { return Math.round(n * 10) / 10; }
function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function toast(msg, isErr = false) {
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast' + (isErr ? ' err' : '');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

function openModal(html) {
  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.getElementById('modal-body').innerHTML = '';
}
document.addEventListener('click', (e) => {
  if (e.target.id === 'modal-overlay') closeModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

function openSidebar() { document.getElementById('sidebar').classList.add('open'); }
function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); }
/* ============================================================
   LEDGER — domain constants & seeding
   ============================================================ */

// day-of-week -> class block for Fall 2026 Webster schedule
const SCHEDULE = {

  Tuesday:   { code: 'ANSO 1050', name: 'Global Social Problems', time: '14:00–16:20' },

  Saturday:  null,
  Sunday:    null
};

// suggested weekly load shape — used only to seed defaults / label days, never locks the user in
const DAY_PLAN = {

  Tuesday:   { training: 'run', intensity: 'moderate', note: 'Afternoon class — run before or after.' },
  Wednesday: { training: 'gym', intensity: 'moderate', note: 'Evening class — train earlier in the day.' },

};

// performance weighting — default, editable in Settings
const DEFAULT_WEIGHTS = {
  academic: 30,
  physical: 25,
  languages: 15,
  professional: 15,
  recovery: 10,
  discipline: 5
};

const SKILL_TREE = {
  Academic: ['Research', 'Critical Thinking', 'Academic Writing', 'Argumentation', 'Analysis', 'Presentation'],
  Languages: ['English (Academic)', 'Spanish'],
  Physical: ['Strength', 'Endurance', 'Mobility', 'Conditioning'],
  Professional: ['Project Management', 'Communication', 'Practical Experience', 'Portfolio']
};

const STRENGTH_SPLIT = {
  // simple upper/lower/full rotation appropriate for "some experience, no structure", 3x/week
  A: {
    label: 'Push-dominant Upper',
    exercises: ['Barbell/DB Bench Press', 'Overhead Press', 'Incline DB Press', 'Triceps Pushdown or Dips', 'Lateral Raise']
  },
  B: {
    label: 'Lower Body',
    exercises: ['Back Squat', 'Romanian Deadlift', 'Walking Lunge', 'Leg Curl or Nordic', 'Calf Raise']
  },
  C: {
    label: 'Pull-dominant Upper + Core',
    exercises: ['Weighted Pull-up or Lat Pulldown', 'Barbell/DB Row', 'Face Pull', 'Biceps Curl', 'Hanging Leg Raise']
  }
};

async function seedIfEmpty() {
  const existing = await dbGetAll('courses');
  if (existing.length > 0) return;

  // courses from stated schedule
  for (const day of Object.keys(SCHEDULE)) {
    const c = SCHEDULE[day];
    if (!c) continue;
    const already = (await dbGetAll('courses')).find(x => x.code === c.code);
    if (already) continue;
    await dbPut('courses', {
      id: uid(), code: c.code, name: c.name, professor: '', day, time: c.time,
      priority: 'medium', status: 'active', notes: ''
    });
  }

  // starter habits
  const habitDefs = [
    { name: 'Reading', category: 'academic', frequency: 'daily', min: '20 min', ideal: '45 min' },
    { name: 'Spanish exposure', category: 'languages', frequency: 'daily', min: '10 min', ideal: '20 min' },
    { name: 'Sleep logged', category: 'recovery', frequency: 'daily', min: 'logged', ideal: '7h+' },
    { name: 'One output action', category: 'academic', frequency: 'daily', min: 'one paragraph/problem', ideal: 'full session' },
    { name: 'Strength session', category: 'physical', frequency: 'weekly', min: '1x', ideal: '3x/week' },
    { name: 'Run', category: 'physical', frequency: 'weekly', min: '1x', ideal: '2–3x/week' },
    { name: 'Writing / research block', category: 'academic', frequency: 'weekly', min: '1x', ideal: '1x, 60+ min' },
    { name: 'Speaking / discussion practice', category: 'languages', frequency: 'weekly', min: '1x', ideal: '2x' },
    { name: 'Project / portfolio work', category: 'professional', frequency: 'weekly', min: '1x', ideal: '1x, 60+ min' }
  ];
  for (const h of habitDefs) {
    await dbPut('habits', {
      id: uid(), name: h.name, category: h.category, frequency: h.frequency,
      target: h.ideal, minViable: h.min, idealVersion: h.ideal,
      createdAt: nowISO(), archived: false
    });
  }

  // skill tree entries
  for (const group of Object.keys(SKILL_TREE)) {
    for (const skillName of SKILL_TREE[group]) {
      await dbPut('skills', {
        id: uid(), group, name: skillName, level: 1, evidenceCount: 0,
        lastPracticed: null, milestones: []
      });
    }
  }

  // weights
  await dbPut('meta', { key: 'weights', value: DEFAULT_WEIGHTS });
  await dbPut('meta', { key: 'profile', value: { height: 173, weight: 63, sleepNote: 'often short on sleep' } });
}

  return rec ? rec.value : DEFAULT_WEIGHTS;

async function computeDailyScore(iso) {
  const weights = await getWeights();
  const [habits, habitLogs, runs, strength, studySessions, languageLogs, projects, recoveryLogs] = await Promise.all([
    dbGetAll('habits'), dbGetAll('habitLogs'), dbGetAll('runs'), dbGetAll('strengthSessions'),
    dbGetAll('studySessions'), dbGetAll('languageLogs'), dbGetAll('projects'), dbGetAll('recoveryLogs')
  ]);
  const todayLogs = habitLogs.filter(l => l.date === iso);

  // each domain: 0-100 based on achievement-weighted activity for the day, not just checkbox count
  const academic = clamp(studySessions.filter(s => s.date === iso).reduce((sum, s) => sum + (s.type === 'output' ? 40 : s.type === 'practice' ? 22 : 10), 0), 0, 100);
  const physical = clamp((runs.some(r => r.date === iso) ? 55 : 0) + (strength.some(s => s.date === iso) ? 55 : 0), 0, 100);
  const languages = clamp(languageLogs.filter(l => l.date === iso).reduce((sum, l) => sum + (l.type === 'speaking' ? 35 : 20), 0), 0, 100);
  const professional = clamp(projects.filter(p => p.lastWorkedDate === iso).length * 50, 0, 100);
  const recovery = recoveryLogs.some(r => r.date === iso) ? 100 : 0;
  const dailyHabits = habits.filter(h => h.frequency === 'daily' && !h.archived);
  const discipline = dailyHabits.length ? clamp(Math.round((todayLogs.length / dailyHabits.length) * 100), 0, 100) : 0;

  const total =
    academic * weights.academic +
    physical * weights.physical +
    languages * weights.languages +
    professional * weights.professional +
    recovery * weights.recovery +
    discipline * weights.discipline;
  const maxPossible = Object.values(weights).reduce((a, b) => a + b, 0) * 100;
  return Math.round((total / maxPossible) * 100);
}

async function renderWeek() {
  const container = document.getElementById('page-week');
  const dnames = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];

  ]);

  // map this calendar week's dates (Mon-Sun)

  const jsDay = now.getDay(); // 0 sun .. 6 sat

  const weekDates = {};
  dnames.forEach((name, i) => {
    weekDates[name] = todayISO(mondayOffset + i);
  });

  const weeklyRunDist = runs.filter(r => Object.values(weekDates).includes(r.date))

    const liftedThatDay = strength.some(s => s.date === date);
    return `

        </div>
      </div>`;
  }).join('');

  const dueThisWeek = assignments
    .filter(a => a.status !== 'done' && a.dueDate && Object.values(weekDates).includes(a.dueDate))
    .sort((a, b) => a.dueDate.localeCompare(b.dueDate));

  const weeklyHabits = habits.filter(h => h.frequency === 'weekly' && !h.archived);
  const weeklyHabitProgress = weeklyHabits.map(h => {

  container.innerHTML = `

async function recoveryTabHtml() {
  const logs = (await dbGetAll('recoveryLogs')).sort((a, b) => b.date.localeCompare(a.date));
  const last7 = logs.slice(0, 7);
  const avgSleep = last7.length ? round1(last7.reduce((s, l) => s + Number(l.sleepHours || 0), 0) / last7.length) : 0;
  const avgReadiness = last7.length ? round1(last7.reduce((s, l) => s + Number(l.readiness || 0), 0) / last7.length) : 0;

  // overload flag: 2+ hard sessions in a row with no recovery day logged between
  const [runs, strength] = await Promise.all([dbGetAll('runs'), dbGetAll('strengthSessions')]);
  const last3days = [todayISO(), todayISO(-1), todayISO(-2)];
  const hardSessions = last3days.filter(d =>
    runs.some(r => r.date === d && r.sessionType === 'hard') ||
    strength.some(s => s.date === d)
  ).length;
  const recentRecoveryLog = logs.some(l => last3days.includes(l.date) && Number(l.readiness) <= 2);
  const overloadFlag = hardSessions >= 3 || (hardSessions >= 2 && recentRecoveryLog);

  return `
    ${overloadFlag ? `<div class="card" style="border-color:var(--danger);margin-bottom:16px;">
        <strong style="color:var(--danger);font-size:13px;">Overload flag</strong>
        <p class="muted" style="font-size:13px;margin:6px 0 0;">Multiple hard sessions stacked with low readiness. Given sleep is often short for you, consider a lighter or full recovery day next.</p>
      </div>` : ''}
    <div class="grid grid-3" style="margin-bottom:18px;">
      <div class="stat violet"><div class="stat-num">${avgSleep || '—'}h</div><div class="stat-label">avg sleep (last 7 logs)</div></div>
      <div class="stat violet"><div class="stat-num">${avgReadiness || '—'}/5</div><div class="stat-label">avg readiness</div></div>
      <div class="stat violet"><div class="stat-num">${logs.length}</div><div class="stat-label">recovery logs total</div></div>
    </div>
    <div class="row between" style="margin-bottom:12px;">
      <div class="section-title">Log</div>
      <button class="btn primary small" id="btn-add-recovery">+ Log recovery</button>
    </div>
    ${logs.length ? `<div class="card">${logs.slice(0, 14).map(l => `
      <div class="list-item">
        <span>${l.sleepHours}h sleep · readiness ${l.readiness}/5 · session difficulty ${l.difficulty || '—'}/5
          ${l.notes ? `<div class="faint" style="font-size:12px;">${escapeHtml(l.notes)}</div>` : ''}
        </span>
        <span class="faint mono">${shortDate(l.date)}</span>
      </div>`).join('')}</div>` : `<div class="empty">No recovery logs yet. Since sleep tends to run short, this is the most important habit to keep consistent.</div>`}

function currentWeekDates() {
  const now = new Date();
  const jsDay = now.getDay();
  const mondayOffset = jsDay === 0 ? -6 : 1 - jsDay;
  const arr = [];
  for (let i = 0; i < 7; i++) arr.push(todayISO(mondayOffset + i));
  return arr;
}

function computeStreakFromDates(dates) {
  const set = new Set(dates);
  let streak = 0;
  let cursor = todayISO();
  while (set.has(cursor)) {
    streak++;
    cursor = todayISO(-streak);
  }
  return streak;
}

// evidence thresholds to advance a level — deliberately not 1:1 with checkbox counts
const LEVEL_THRESHOLDS = [0, 3, 8, 16, 28, 45];

function levelFromEvidence(count) {
  let lvl = 1;
  for (let i = 1; i < LEVEL_THRESHOLDS.length; i++) {
    if (count >= LEVEL_THRESHOLDS[i]) lvl = i + 1;
  }
  return clamp(lvl, 1, LEVEL_THRESHOLDS.length);
}

async function bumpSkillEvidence(skillName) {
  const skills = await dbGetAll('skills');
  const skill = skills.find(s => s.name === skillName);
  if (!skill) return;
  skill.evidenceCount = (skill.evidenceCount || 0) + 1;
  skill.level = levelFromEvidence(skill.evidenceCount);
  skill.lastPracticed = todayISO();
  await dbPut('skills', skill);
}

async function renderSkills() {
  const container = document.getElementById('page-skills');

  container.innerHTML = `

    </div>
    ${groups.map(group => {
      const items = skills.filter(s => s.group === group).sort((a, b) => a.name.localeCompare(b.name));
      const color = group === 'Physical' ? 'track' : group === 'Languages' ? 'signal' : group === 'Professional' ? 'amber' : 'ink';
      return `
        <div class="section">
          <div class="section-head"><div class="section-title">${group}</div></div>
          <div class="grid grid-3">
            ${items.map(s => {
              const nextThreshold = LEVEL_THRESHOLDS[Math.min(s.level, LEVEL_THRESHOLDS.length - 1)] || LEVEL_THRESHOLDS[LEVEL_THRESHOLDS.length - 1];
              const prevThreshold = LEVEL_THRESHOLDS[s.level - 1] || 0;
              const span = Math.max(1, nextThreshold - prevThreshold);
              const progress = clamp(Math.round(((s.evidenceCount - prevThreshold) / span) * 100), 0, 100);
              return `
                <div class="card">
                  <div class="row between"><strong style="font-size:13px;">${escapeHtml(s.name)}</strong><span class="pill ${color}">Lv ${s.level}</span></div>
                  <div class="bar-track" style="margin-top:10px;"><div class="bar-fill" style="width:${progress}%;background:var(--${color === 'faint' ? 'text-faint' : color});"></div></div>
                  <div class="faint" style="font-size:11px;margin-top:5px;">${s.evidenceCount} evidence logged ${s.lastPracticed ? '· last ' + shortDate(s.lastPracticed) : '· not started'}</div>
                </div>`;
            }).join('')}
          </div>
        </div>`;
    }).join('')}
  `;

async function collectActivityDates() {
  const stores = ['habitLogs', 'runs', 'strengthSessions', 'studySessions', 'languageLogs', 'recoveryLogs'];
  const all = await Promise.all(stores.map(s => dbGetAll(s)));
  const dates = {};
  all.flat().forEach(rec => {
    if (rec.date) dates[rec.date] = (dates[rec.date] || 0) + 1;
  });
  return dates;
}

function setupCanvas(canvas) {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  return { ctx, w: rect.width, h: rect.height };
}

async function drawHeatmap() {
  const canvas = document.getElementById('heatmap-canvas');
  if (!canvas) return;
  const { ctx, w, h } = setupCanvas(canvas);
  const dates = await collectActivityDates();
  const weeks = 12;
  const cell = Math.min(14, (w - 20) / weeks);
  const gap = 3;
  const startOffset = -(weeks * 7 - 1);

  ctx.clearRect(0, 0, w, h);
  for (let week = 0; week < weeks; week++) {
    for (let d = 0; d < 7; d++) {
      const dayIndex = startOffset + week * 7 + d;
      const iso = todayISO(dayIndex);
      const count = dates[iso] || 0;
      const intensity = clamp(count / 4, 0, 1);
      ctx.fillStyle = count === 0 ? '#22252b' : mixColor('#123a2c', '#35c98d', intensity);
      const x = 10 + week * (cell + gap);
      const y = 10 + d * (cell + gap);
      roundRect(ctx, x, y, cell, cell, 2);
      ctx.fill();
    }
  }
}

function mixColor(c1, c2, t) {
  const p1 = hexToRgb(c1), p2 = hexToRgb(c2);
  const r = Math.round(p1.r + (p2.r - p1.r) * t);
  const g = Math.round(p1.g + (p2.g - p1.g) * t);
  const b = Math.round(p1.b + (p2.b - p1.b) * t);
  return `rgb(${r},${g},${b})`;
}
function hexToRgb(hex) {
  const n = parseInt(hex.replace('#', ''), 16);
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

async function drawScoreLine() {
  const canvas = document.getElementById('score-canvas');
  if (!canvas) return;
  const { ctx, w, h } = setupCanvas(canvas);
  const days = [];
  for (let i = -13; i <= 0; i++) days.push(todayISO(i));
  const scores = [];
  for (const d of days) scores.push(await computeDailyScore(d));

  ctx.clearRect(0, 0, w, h);
  const pad = 24;
  const maxY = 100;
  const stepX = (w - pad * 2) / (days.length - 1);

  // gridlines
  ctx.strokeStyle = '#22252b';
  ctx.lineWidth = 1;
  [0, 25, 50, 75, 100].forEach(v => {
    const y = h - pad - (v / maxY) * (h - pad * 2);
    ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(w - pad, y); ctx.stroke();
  });

  ctx.strokeStyle = '#6d8bff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  scores.forEach((s, i) => {
    const x = pad + i * stepX;
    const y = h - pad - (s / maxY) * (h - pad * 2);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();

  ctx.fillStyle = '#6d8bff';
  scores.forEach((s, i) => {
    const x = pad + i * stepX;
    const y = h - pad - (s / maxY) * (h - pad * 2);
    ctx.beginPath(); ctx.arc(x, y, 2.5, 0, Math.PI * 2); ctx.fill();
  });
}

async function drawRunBars() {
  const canvas = document.getElementById('run-canvas');
  if (!canvas) return;
  const { ctx, w, h } = setupCanvas(canvas);
  const runs = await dbGetAll('runs');
  const weeks = [];
  const now = new Date();
  const jsDay = now.getDay();
  const mondayOffset = jsDay === 0 ? -6 : 1 - jsDay;
  for (let i = 7; i >= 0; i--) {
    const weekStart = mondayOffset - i * 7;
    const dates = [];
    for (let d = 0; d < 7; d++) dates.push(todayISO(weekStart + d));
    const dist = runs.filter(r => dates.includes(r.date)).reduce((s, r) => s + Number(r.distanceKm || 0), 0);
    weeks.push(dist);
  }
  const maxDist = Math.max(5, ...weeks);
  ctx.clearRect(0, 0, w, h);
  const pad = 24;
  const barW = (w - pad * 2) / weeks.length * 0.6;
  const gap = (w - pad * 2) / weeks.length;
  weeks.forEach((dist, i) => {
    const barH = (dist / maxDist) * (h - pad * 2);
    const x = pad + i * gap + (gap - barW) / 2;
    const y = h - pad - barH;
    ctx.fillStyle = '#ff5d2e';
    roundRect(ctx, x, y, barW, barH, 2);
    ctx.fill();
  });
}

        <button class="btn primary small" id="save-weights">Save weights</button>
      </div>
    </div>

    <div class="section">
      <div class="section-head between"><div class="section-title">Habits <span class="n">(${habits.length})</span></div><button class="btn small" id="btn-add-habit">+ Habit</button></div>
      <div class="card">
        ${habits.length ? habits.map(h => `
          <div class="list-item">
            <span><span class="pill ${h.frequency === 'daily' ? 'ink' : 'violet'}">${h.frequency}</span> ${escapeHtml(h.name)} <span class="faint">— min: ${escapeHtml(h.minViable)}, ideal: ${escapeHtml(h.idealVersion)}</span></span>
            <button class="btn ghost small" data-archive-habit="${h.id}">Archive</button>
          </div>`).join('') : '<div class="empty">No active habits.</div>'}
      </div>
    </div>

    <div class="section">
      <div class="section-head between"><div class="section-title">Goals <span class="n">(${goals.length})</span></div><button class="btn small" id="btn-add-goal">+ Goal</button></div>
      <div class="card">
        ${goals.length ? goals.map(g => `
          <div class="list-item">
            <span>${escapeHtml(g.text)} ${g.targetDate ? `<span class="faint">— by ${shortDate(g.targetDate)}</span>` : ''}</span>
            <button class="btn ghost small" data-del-goal="${g.id}">✕</button>
          </div>`).join('') : '<div class="empty">No goals set yet.</div>'}
      </div>
    </div>

    <div class="section">
      <div class="section-head"><div class="section-title">Data</div></div>
      <div class="card row wrap" style="gap:10px;">
        <button class="btn" id="btn-export">Export all data (JSON)</button>
        <label class="btn" style="position:relative;">Import backup<input type="file" id="import-file" accept="application/json" style="position:absolute;inset:0;opacity:0;cursor:pointer;"></label>
        <button class="btn danger" id="btn-reset">Reset database</button>
      </div>
      <p class="faint" style="font-size:11px;margin-top:8px;">Everything is stored locally in your browser via IndexedDB. Nothing is sent anywhere. Export regularly if you care about not losing it.</p>
    </div>
  `;

  const sumEl = document.getElementById('weight-sum');
  function updateSum() {
    const sum = Object.keys(weights).reduce((s, k) => s + Number(document.getElementById('w-' + k).value || 0), 0);
    sumEl.textContent = `Current sum: ${sum}${sum !== 100 ? ' — does not need to be exactly 100; the score is normalized either way.' : ' ✓'}`;
  }
  Object.keys(weights).forEach(k => document.getElementById('w-' + k).addEventListener('input', updateSum));
  updateSum();

  document.getElementById('save-weights').addEventListener('click', async () => {
    const newWeights = {};
    Object.keys(weights).forEach(k => newWeights[k] = Number(document.getElementById('w-' + k).value || 0));
    await dbPut('meta', { key: 'weights', value: newWeights });
    toast('Weights saved.');
  });

  document.getElementById('btn-add-habit').addEventListener('click', openHabitModal);
  container.querySelectorAll('[data-archive-habit]').forEach(b => b.addEventListener('click', async () => {
    const h = await dbGet('habits', b.dataset.archiveHabit); h.archived = true; await dbPut('habits', h); renderSettings();
  }));
  document.getElementById('btn-add-goal').addEventListener('click', openGoalModal);
  container.querySelectorAll('[data-del-goal]').forEach(b => b.addEventListener('click', async () => {
    await dbDelete('goals', b.dataset.delGoal); renderSettings();
  }));

  document.getElementById('btn-export').addEventListener('click', exportAllData);
  document.getElementById('import-file').addEventListener('change', importDataFile);
  document.getElementById('btn-reset').addEventListener('click', confirmResetDatabase);
}

function openHabitModal() {
  openModal(`
    <h3>Add habit</h3>
    <div class="field"><label>Name</label><input id="h-name" placeholder="e.g. Vocabulary review"></div>
    <div class="row">
      <div class="field" style="flex:1;"><label>Category</label>
        <select id="h-cat"><option value="academic">Academic</option><option value="physical">Physical</option><option value="languages">Languages</option><option value="professional">Professional</option><option value="recovery">Recovery</option></select>
      </div>
      <div class="field" style="flex:1;"><label>Frequency</label>
        <select id="h-freq"><option value="daily">Daily</option><option value="weekly">Weekly</option></select>
      </div>
    </div>
    <div class="row">
      <div class="field" style="flex:1;"><label>Minimum viable</label><input id="h-min" placeholder="e.g. 10 min"></div>
      <div class="field" style="flex:1;"><label>Ideal version</label><input id="h-ideal" placeholder="e.g. 30 min"></div>
    </div>
    <div class="row" style="justify-content:flex-end;margin-top:8px;">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn primary" id="save-habit">Save</button>
    </div>
  `);
  document.getElementById('save-habit').addEventListener('click', async () => {
    const name = document.getElementById('h-name').value.trim();
    if (!name) { toast('Enter a name.', true); return; }
    await dbPut('habits', {
      id: uid(), name, category: document.getElementById('h-cat').value, frequency: document.getElementById('h-freq').value,
      minViable: document.getElementById('h-min').value, idealVersion: document.getElementById('h-ideal').value,
      target: document.getElementById('h-ideal').value, createdAt: nowISO(), archived: false
    });
    closeModal(); toast('Habit added.'); renderSettings();
  });
}

function openGoalModal() {
  openModal(`
    <h3>Add goal</h3>
    <div class="field"><label>Goal</label><textarea id="g-text" placeholder="What are you aiming for?"></textarea></div>
    <div class="field"><label>Target date (optional)</label><input type="date" id="g-date"></div>
    <div class="row" style="justify-content:flex-end;margin-top:8px;">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn primary" id="save-goal">Save</button>
    </div>
  `);
  document.getElementById('save-goal').addEventListener('click', async () => {
    const text = document.getElementById('g-text').value.trim();
    if (!text) { toast('Enter a goal.', true); return; }
    await dbPut('goals', { id: uid(), text, targetDate: document.getElementById('g-date').value, createdAt: nowISO() });
    closeModal(); toast('Goal added.'); renderSettings();
  });
}

async function exportAllData() {
  const data = {};
  for (const s of STORES) data[s.name] = await dbGetAll(s.name);
  data.__exportedAt = nowISO();
  data.__dbVersion = DB_VERSION;
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `ledger-backup-${todayISO()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('Exported.');
}

function importDataFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const data = JSON.parse(reader.result);
      openModal(`
        <h3>Import backup</h3>
        <p class="muted" style="font-size:13px;">This will overwrite existing records with matching IDs. Continue?</p>
        <div class="row" style="justify-content:flex-end;margin-top:12px;">
          <button class="btn ghost" onclick="closeModal()">Cancel</button>
          <button class="btn primary" id="confirm-import">Import</button>
        </div>
      `);
      document.getElementById('confirm-import').addEventListener('click', async () => {
        for (const s of STORES) {
          if (Array.isArray(data[s.name])) {
            for (const rec of data[s.name]) await dbPut(s.name, rec);
          }
        }
        closeModal(); toast('Import complete.'); goTo(currentPage);
      });
    } catch (err) {
      toast('Invalid backup file.', true);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function confirmResetDatabase() {
  openModal(`
    <h3>Reset database</h3>
    <p class="muted" style="font-size:13px;">This permanently deletes all local data — habits, training logs, courses, everything. Export a backup first if you want to keep it. This cannot be undone.</p>
    <div class="row" style="justify-content:flex-end;margin-top:12px;">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn danger" id="confirm-reset">Yes, delete everything</button>
    </div>
  `);
  document.getElementById('confirm-reset').addEventListener('click', async () => {
    for (const s of STORES) await dbClear(s.name);
    await seedIfEmpty();
    closeModal(); toast('Database reset.'); goTo('today');
  });
}
/* ============================================================
   LEDGER — boot
   ============================================================ */
const PAGE_RENDERERS = {
  today: renderToday,
  week: renderWeek,
  training: renderTraining,
  academic: renderAcademic,
  languages: renderLanguages,
  projects: renderProjects,
  skills: renderSkills,
  charts: renderCharts,
  reflection: renderReflection,
  settings: renderSettings
};

function buildPageContainers() {
  const pagesEl = document.getElementById('pages');
  pagesEl.innerHTML = PAGES.map(p => `<div class="page" id="page-${p.id}"></div>`).join('');
}

async function boot() {
  buildPageContainers();
  try {
    await openDatabase();
    await seedIfEmpty();
  } catch (err) {
    document.getElementById('pages').innerHTML = `
      <div class="card" style="border-color:var(--danger);">
        <strong style="color:var(--danger);">Could not open local database.</strong>
        <p class="muted" style="font-size:13px;">${escapeHtml(err && err.message ? err.message : String(err))}</p>
        <p class="muted" style="font-size:13px;">Try opening this file in a different browser, or check that private/incognito mode isn't blocking IndexedDB.</p>
      </div>`;
    return;
  }
  renderNav();
  document.getElementById('sidebar-foot').textContent = 'Stored locally · IndexedDB';
  initRouter();
}


/* ============================================================
   LEDGER — phone app layer: tab bar, install, reminders
   ============================================================ */
(function(){
  const bar=document.getElementById('tabbar');
  bar.querySelectorAll('[data-tab-go]').forEach(b=>b.addEventListener('click',()=>goTo(b.dataset.tabGo)));
  bar.querySelector('[data-tab-more]').addEventListener('click',openSidebar);
  const _rn=renderNav;
  renderNav=function(){_rn();bar.querySelectorAll('[data-tab-go]').forEach(b=>b.classList.toggle('active',b.dataset.tabGo===currentPage));};
})();

let _installEv=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();_installEv=e;});

const REM_DEFAULTS=[
 {id:'morning',label:'Plan the day',time:'07:30',days:[0,1,2,3,4,5,6],on:true,body:'Open Today and set your top 3. Minimum viable version counts.'},
 {id:'study',label:'Study block',time:'15:00',days:[1,2,3,4,5],on:true,body:'Start the ugly 25 minutes: input, practice, output.'},
 {id:'train',label:'Training',time:'17:30',days:[1,2,3,4,5,6],on:true,body:'Shoes on. Log the session after, even a short one.'},
 {id:'ielts',label:'IELTS task',time:'20:00',days:[0,1,2,3,4,5,6],on:true,body:'One IELTS task today: speaking, writing, listening or reading.'},
 {id:'night',label:'Evening reflection',time:'21:45',days:[0,1,2,3,4,5,6],on:true,body:'Log habits and write 3 lines. Then sleep.'}
];
async function loadRem(){const r=await dbGet('meta','reminders');return r&&r.items?r:{key:'reminders',items:REM_DEFAULTS.map(x=>({...x})),fired:{}};}
async function habitsLeft(){
  const h=(await dbGetAll('habits')).filter(x=>!x.archived&&x.frequency==='daily');
  const l=(await dbGetAll('habitLogs')).filter(x=>x.date===todayISO());
  return h.filter(x=>!l.some(y=>y.habitId===x.id)).length;
}
const NATIVE=!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
const LN=()=>window.Capacitor.Plugins.LocalNotifications;
async function nativePerm(){try{const p=(await LN().checkPermissions()).display;return p==='granted'?'granted':p==='denied'?'denied':'default';}catch(e){return 'denied';}}
async function scheduleNative(){
  try{
    const ln=LN(),pend=await ln.getPending();
    if(pend.notifications.length)await ln.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
    const rec=await loadRem(),list=[];
    rec.items.forEach((it,i)=>{if(!it.on)return;const[h,m]=it.time.split(':').map(Number);
      it.days.forEach(d=>list.push({id:1000+i*10+d,title:it.label,body:it.body,schedule:{on:{weekday:d+1,hour:h,minute:m},allowWhileIdle:true}}));});
    if(list.length)await ln.schedule({notifications:list});
  }catch(e){}
}
async function fireNote(title,body,tag){
  if(NATIVE){try{await LN().schedule({notifications:[{id:9999,title,body,schedule:{at:new Date(Date.now()+2000)}}]});return true;}catch(e){return false;}}
  if(!('Notification' in window)||Notification.permission!=='granted')return false;
  try{
    const reg=('serviceWorker' in navigator)?await navigator.serviceWorker.getRegistration():null;
    if(reg)await reg.showNotification(title,{body,tag,icon:'icon-192.png',badge:'icon-192.png',data:{url:'./#today'}});
    else new Notification(title,{body,tag});
    return true;
  }catch(e){return false;}
}
async function checkReminders(){
  if(NATIVE)return;
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const rec=await loadRem(),now=new Date(),iso=todayISO(),mins=now.getHours()*60+now.getMinutes();
  rec.fired=rec.fired||{};let ch=false;
  for(const it of rec.items){
    if(!it.on||!it.days.includes(now.getDay())||rec.fired[it.id]===iso)continue;
    const[h,m]=it.time.split(':').map(Number),t=h*60+m;
    if(mins>=t&&mins-t<=90){
      let body=it.body;
      if(it.id==='night'){const n=await habitsLeft();if(n>0)body+=` ${n} daily habit${n>1?'s':''} still open.`;}
      if(await fireNote(it.label,body,it.id)){rec.fired[it.id]=iso;ch=true;}
    }
  }
  if(ch)await dbPut('meta',rec);
}
async function addReminderCard(){
  const c=document.getElementById('page-settings');if(!c||c.querySelector('#rem-card'))return;
  const rec=await loadRem(),perm=NATIVE?await nativePerm():(('Notification' in window)?Notification.permission:'unsupported');
  const ios=/iphone|ipad/i.test(navigator.userAgent),standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  const days=['Su','Mo','Tu','We','Th','Fr','Sa'];
  const html=`<div class="section" id="rem-card"><div class="section-head"><div class="section-title">Reminders &amp; phone app</div></div><div class="card">
    <p class="muted" style="font-size:13px;margin:0 0 12px;">${perm==='granted'?'Notifications are on.':perm==='denied'?'Notifications are blocked. Enable them in your browser or phone settings for this app.':perm==='unsupported'?'This browser does not support notifications.':'Turn on notifications to get your reminders.'}
    ${ios&&!standalone?' On iPhone: tap Share, then Add to Home Screen, then open Ledger from the home screen. Notifications only work from there.':''}</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;">
      ${perm==='default'?'<button class="btn primary small" id="rem-perm">Enable notifications</button>':''}
      ${perm==='granted'?'<button class="btn small" id="rem-test">Send test</button>':''}
      ${_installEv?'<button class="btn small" id="rem-install">Install app</button>':''}
    </div>
    ${rec.items.map(it=>`<div class="rem-row"><input type="checkbox" data-rem-on="${it.id}" ${it.on?'checked':''}>
      <div><div>${it.label}</div><div class="faint" style="font-size:12px;">${it.days.length===7?'Every day':it.days.map(d=>days[d]).join(' ')}</div></div>
      <input type="time" data-rem-time="${it.id}" value="${it.time}"></div>`).join('')}
    <p class="faint" style="font-size:12px;margin:10px 0 0;">${NATIVE?'Reminders are scheduled on your phone and fire even when the app is closed.':'Reminders fire when Ledger is open or was recently used. For the most reliable alerts, install it and keep notifications allowed.'}</p>
  </div></div>`;
  if(c.querySelector('#rem-card'))return;
  const head=c.querySelector('.page-head');
  head?head.insertAdjacentHTML('afterend',html):c.insertAdjacentHTML('afterbegin',html);
  const q=s=>c.querySelector(s);
  q('#rem-perm')&&q('#rem-perm').addEventListener('click',async()=>{if(NATIVE){await LN().requestPermissions();await scheduleNative();}else await Notification.requestPermission();c.querySelector('#rem-card').remove();addReminderCard();checkReminders();});
  q('#rem-test')&&q('#rem-test').addEventListener('click',()=>fireNote('Ledger','Notifications work. Now go do the first thing.','test'));
  q('#rem-install')&&q('#rem-install').addEventListener('click',async()=>{_installEv.prompt();await _installEv.userChoice;_installEv=null;c.querySelector('#rem-card').remove();addReminderCard();});
  c.querySelectorAll('[data-rem-on]').forEach(el=>el.addEventListener('change',async()=>{const r=await loadRem();r.items.find(i=>i.id===el.dataset.remOn).on=el.checked;await dbPut('meta',r);if(NATIVE)scheduleNative();toast('Saved');}));
  c.querySelectorAll('[data-rem-time]').forEach(el=>el.addEventListener('change',async()=>{const r=await loadRem();const it=r.items.find(i=>i.id===el.dataset.remTime);it.time=el.value;delete r.fired[it.id];await dbPut('meta',r);if(NATIVE)scheduleNative();toast('Saved');}));
}
const _rsOrig=PAGE_RENDERERS.settings;
PAGE_RENDERERS.settings=async()=>{await _rsOrig();await addReminderCard();};

async function startPhoneLayer(){
  if(NATIVE){if(await nativePerm()==='granted')scheduleNative();return;}
  if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
    try{
      const reg=await navigator.serviceWorker.register('sw.js');
      const ready=await navigator.serviceWorker.ready;
      if(ready.periodicSync){try{await ready.periodicSync.register('ledger-reminders',{minInterval:3600000});}catch(e){}}
    }catch(e){}
  }
  checkReminders();
  setInterval(checkReminders,30000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkReminders();});
}

boot().then(startPhoneLayer);
